<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sobre nós - Untitle Game</title>

  <!-- Fonte bonita 😎 -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    body {
      background: black;
      color: white;
      text-align: center;
      font-family: 'Poppins', sans-serif;
      padding: 50px;
    }

    h1 {
      font-size: 40px;
    }

    p {
      font-size: 18px;
      margin-top: 20px;
    }

    /* BOTÃO VOLTAR 🔥 */
    .voltar-btn {
      display: inline-block;
      margin-top: 30px;
      padding: 12px 25px;

      background: #dd00ff;
      color: black;

      font-size: 18px;
      font-weight: bold;

      text-decoration: none;
      border-radius: 12px;

      transition: 0.3s;
    }

    .voltar-btn:hover {
      background: #dd00ff;
      transform: scale(1.1);
      box-shadow: 0 0 15px purple;
    }
  </style>
</head>

<body>

  <h1>Sobre nós</h1>

  <p>
    O Untitle Game é um jogo criado para desafiar sua mente e testar sua paciência 😈<br>
    Aqui, cada botão pode estar em qualquer lugar... ou em lugar nenhum 👀
  </p>

  <a href="index.html" class="voltar-btn">⬅ Voltar</a>

</body>
</html>
